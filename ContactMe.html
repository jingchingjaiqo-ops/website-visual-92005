    <main>

        <h2><mark>Fill in below and I will reply by email:</mark></h2>
    <form action="https://formspree.io/f/myeygenk" method="POST">

        <label for="firstName">First Name:<mark>*</mark></label>
        <input type="text" id="firstName" name="firstName" placeholder="First Name" required>

        <label for="lastName">Last Name:<mark>*</mark></label>
        <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>

        <label for="email">Email Address:<mark>*</mark></label>
        <input type="email" id="email" name="email" placeholder="Email@gmail.com" required>

        <label for="phone">OPTIONAL Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="64225......">

        <label for="message">Send Message:<mark>*</mark></label>
        <textarea id="message" name="message" placeholder="Enter Message" required></textarea>

        <button type="submit">Submit</button>

    </form>
    </main>
